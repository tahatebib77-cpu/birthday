<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>

<style>

body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#0f172a,#1e293b);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:Arial;
overflow:hidden;
color:white;
}

/* cake */

.cake{
position:relative;
margin-bottom:50px;
display:flex;
flex-direction:column-reverse;
align-items: center;
}

/* layers */

.layer{
height:50px;
border-radius:14px;
margin:8px auto;
transform:translateY(-400px);
animation:drop 0.8s forwards;
box-shadow:0 8px 15px rgba(0,0,0,0.3);
}

/* top layer */

.layer1{
width:160px;
background:#ff9ec4;
animation-delay:2.1s;
}

/* middle layer */

.layer2{
width:200px;
background:#ff6fa1;
animation-delay:1.3s;
}

/* bottom layer */

.layer3{
width:240px;
background:#ff3f7f;
animation-delay:0.5s;
}

/* candle */

.candle{
width:14px;
height:50px;
background:white;
border-radius:4px;
margin:auto;
transform:translateY(-400px);
animation:drop 0.8s forwards 2.9s;
}

/* flame */

.flame{
width:18px;
height:25px;
background:radial-gradient(circle,yellow,orange,red);
border-radius:50%;
margin:auto;
margin-top:-5px;
opacity:0;
animation:flame 0.8s infinite alternate 3.8s;
}

/* text */

.title{
font-size:42px;
font-weight:bold;
opacity:0;
animation:showText 1s forwards 4s;
text-shadow:0 0 15px #ff6fa1;
}

/* confetti */

.confetti{
position:absolute;
width:10px;
height:10px;
top:-10px;
animation:fall linear infinite;
}

/* balloons */

.balloon{
position:absolute;
bottom:-100px;
width:40px;
height:50px;
border-radius:50%;
animation:rise 8s linear infinite;
}

/* animations */

@keyframes drop{
to{
transform:translateY(0);
}
}

@keyframes flame{
from{
transform:scale(1);
opacity:1;
}
to{
transform:scale(1.3);
opacity:0.7;
}
}

@keyframes showText{
to{
opacity:1;
transform:translateY(10px);
}
}

@keyframes fall{
from{
transform:translateY(-100vh) rotate(0);
}
to{
transform:translateY(100vh) rotate(360deg);
}
}

@keyframes rise{
from{
transform:translateY(0);
}
to{
transform:translateY(-120vh);
}
}

</style>
</head>

<body>

<div class="cake">

<div class="layer layer3"></div>
<div class="layer layer2"></div>
<div class="layer layer1"></div>

<div class="candle"></div>
<div class="flame"></div>

</div>

<div class="title">🎉 Happy Birthday 🎉</div>

<script>

/* confetti */

for(let i=0;i<90;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.backgroundColor=
"hsl("+Math.random()*360+",80%,60%)";

c.style.animationDuration=
(Math.random()*3+3)+"s";

document.body.appendChild(c);

}

/* balloons */

for(let i=0;i<12;i++){

let b=document.createElement("div");

b.className="balloon";

b.style.left=Math.random()*100+"vw";

b.style.backgroundColor=
"hsl("+Math.random()*360+",70%,60%)";

b.style.animationDuration=
(Math.random()*5+6)+"s";

document.body.appendChild(b);

}

</script>

</body>
</html>
